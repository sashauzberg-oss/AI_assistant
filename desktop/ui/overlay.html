<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; font-src 'self'; script-src 'self'">
  <title>Nova snip</title>
  <style>
    @font-face { font-family: "Pixelify Sans"; font-weight: 400; src: url("../../public/fonts/pixelify-sans-latin-400-normal.woff2") format("woff2"); }
    @font-face { font-family: "Pixelify Sans"; font-weight: 700; src: url("../../public/fonts/pixelify-sans-latin-700-normal.woff2") format("woff2"); }
    @font-face { font-family: "Press Start 2P"; src: url("../../public/fonts/press-start-2p-latin-400-normal.woff2") format("woff2"); }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; cursor: crosshair; user-select: none; }
    #shot { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
    #dim { position: fixed; inset: 0; background: rgba(5, 7, 12, 0.38); }
    body.selecting #dim { display: none; }
    #sel {
      position: fixed; display: none; outline: 3px dashed #ff5fa2; outline-offset: 0; border: 3px solid #0b0818;
      box-shadow: 0 0 0 9999px rgba(5, 7, 12, 0.42);
    }
    body.selecting #sel { display: block; }
    #hint {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      background: #241c42; color: #fff; padding: 6px 6px 6px 12px; border-radius: 0;
      font: 15px/1.3 "Pixelify Sans", system-ui, sans-serif; white-space: nowrap; cursor: default; -webkit-font-smoothing: none;
      box-shadow: inset 0 0 0 3px #0b0818, 4px 4px 0 rgba(0, 0, 0, 0.5); display: flex; gap: 10px; align-items: center;
    }
    #hint i { width: 12px; height: 12px; background: #ff5fa2; box-shadow: 3px 3px 0 #7c3aed; display: inline-block; flex: none; }
    #modes { display: flex; gap: 4px; }
    #modes button {
      border: 0; border-radius: 0; padding: 6px 12px; cursor: pointer; font: inherit;
      background: #30285a; color: #f3eaff; box-shadow: inset 0 0 0 2px #0b0818;
    }
    #modes button:hover { background: rgba(255, 255, 255, 0.18); }
    #modes button.on { background: #7c3aed; color: #fff; box-shadow: inset -2px -2px 0 rgba(0,0,0,.3), inset 2px 2px 0 rgba(255,255,255,.3); }
    #modes kbd { opacity: 0.7; font: 8px "Press Start 2P", monospace; margin-left: 5px; }
    #keys { color: #a99cc9; padding-right: 8px; }
    body.selecting #hint { opacity: 0; pointer-events: none; transition: opacity 0.15s; }
    #size {
      position: fixed; display: none; pointer-events: none; padding: 4px 6px; border-radius: 0;
      background: #7c3aed; color: #fff; font: 8px "Press Start 2P", monospace; box-shadow: inset 0 0 0 2px #0b0818;
    }
    body.selecting #size { display: block; }
  </style>
</head>
<body>
  <img id="shot" alt="" draggable="false">
  <div id="dim"></div>
  <div id="sel"></div>
  <div id="size"></div>
  <div id="hint">
    <i></i><span>Drag over it to</span>
    <span id="modes">
      <button type="button" data-mode="answer" class="on">Answer<kbd>1</kbd></button>
      <button type="button" data-mode="text">Copy text<kbd>2</kbd></button>
      <button type="button" data-mode="translate">Translate<kbd>3</kbd></button>
      <button type="button" data-mode="explain">Explain<kbd>4</kbd></button>
    </span>
    <span id="keys"><b>Enter</b> whole screen · <b>Esc</b> cancel</span>
  </div>
  <script src="overlay.js"></script>
</body>
</html>
