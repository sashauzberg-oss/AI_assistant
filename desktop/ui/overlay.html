<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'self'">
  <title>Nova snip</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; cursor: crosshair; user-select: none; }
    #shot { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
    #dim { position: fixed; inset: 0; background: rgba(5, 7, 12, 0.38); }
    body.selecting #dim { display: none; }
    #sel {
      position: fixed; display: none; border: 2px solid #a78bfa; border-radius: 2px;
      box-shadow: 0 0 0 9999px rgba(5, 7, 12, 0.38);
    }
    body.selecting #sel { display: block; }
    #hint {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(20, 22, 34, 0.94); color: #fff; padding: 6px 6px 6px 14px; border-radius: 999px;
      font: 13px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; white-space: nowrap; cursor: default;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35); display: flex; gap: 10px; align-items: center;
    }
    #hint i { width: 14px; height: 14px; border-radius: 50%; background: linear-gradient(135deg, #8b5cf6, #22d3ee); display: inline-block; flex: none; }
    #modes { display: flex; gap: 4px; }
    #modes button {
      border: 0; border-radius: 999px; padding: 6px 12px; cursor: pointer; font: inherit;
      background: rgba(255, 255, 255, 0.1); color: #e5e7eb;
    }
    #modes button:hover { background: rgba(255, 255, 255, 0.18); }
    #modes button.on { background: #7c3aed; color: #fff; }
    #modes kbd { opacity: 0.6; font: 11px ui-monospace, monospace; margin-left: 4px; }
    #keys { color: #9ca3af; padding-right: 8px; }
    body.selecting #hint { opacity: 0; pointer-events: none; transition: opacity 0.15s; }
    #size {
      position: fixed; display: none; pointer-events: none; padding: 2px 6px; border-radius: 5px;
      background: rgba(0, 0, 0, 0.7); color: #fff; font: 12px system-ui, sans-serif;
    }
    body.selecting #size { display: block; }
  </style>
</head>
<body>
  <img id="shot" alt="" draggable="false">
  <div id="dim"></div>
  <div id="sel"></div>
  <div id="size"></div>
  <div id="hint">
    <i></i><span>Drag over it to</span>
    <span id="modes">
      <button type="button" data-mode="answer" class="on">Answer<kbd>1</kbd></button>
      <button type="button" data-mode="text">Copy text<kbd>2</kbd></button>
      <button type="button" data-mode="translate">Translate<kbd>3</kbd></button>
      <button type="button" data-mode="explain">Explain<kbd>4</kbd></button>
    </span>
    <span id="keys"><b>Enter</b> whole screen · <b>Esc</b> cancel</span>
  </div>
  <script src="overlay.js"></script>
</body>
</html>
