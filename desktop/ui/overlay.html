<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'self'">
  <title>Nova snip</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; cursor: crosshair; user-select: none; }
    #shot { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
    #dim { position: fixed; inset: 0; background: rgba(5, 7, 12, 0.38); }
    body.selecting #dim { display: none; }
    #sel {
      position: fixed; display: none; border: 2px solid #a78bfa; border-radius: 2px;
      box-shadow: 0 0 0 9999px rgba(5, 7, 12, 0.38);
    }
    body.selecting #sel { display: block; }
    #hint {
      position: fixed; top: 22px; left: 50%; transform: translateX(-50%);
      background: rgba(20, 22, 34, 0.92); color: #fff; padding: 9px 16px; border-radius: 999px;
      font: 14px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; white-space: nowrap; pointer-events: none;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35); display: flex; gap: 10px; align-items: center;
    }
    #hint i { width: 14px; height: 14px; border-radius: 50%; background: linear-gradient(135deg, #8b5cf6, #22d3ee); display: inline-block; }
    body.selecting #hint { opacity: 0; transition: opacity 0.15s; }
    #size {
      position: fixed; display: none; pointer-events: none; padding: 2px 6px; border-radius: 5px;
      background: rgba(0, 0, 0, 0.7); color: #fff; font: 12px system-ui, sans-serif;
    }
    body.selecting #size { display: block; }
  </style>
</head>
<body>
  <img id="shot" alt="" draggable="false">
  <div id="dim"></div>
  <div id="sel"></div>
  <div id="size"></div>
  <div id="hint"><i></i><span>Drag over the question &nbsp;·&nbsp; <b>Enter</b> whole screen &nbsp;·&nbsp; <b>Esc</b> cancel</span></div>
  <script src="overlay.js"></script>
</body>
</html>
