<!doctype html>
<html lang="en" class="cs-html">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nova on stage</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/cutscene.css">
</head>
<body class="cs-page">
  <!-- The desktop app opens this full screen to play a cutscene (the joke show or the fight); what to play comes in the URL hash. -->
  <script type="module">
    import { playJokeShow } from "./js/cutscene.js";
    import { playFightScene } from "./js/fight.js";

    let show = {};
    try {
      show = JSON.parse(decodeURIComponent(location.hash.slice(1)));
    } catch {
      // nothing to perform
    }
    const done = () => (window.novaStage ? window.novaStage.done() : window.close());
    const play = show.scene === "fight" ? playFightScene : playJokeShow;
    play({ ...show, root: document.body }).finally(done);
  </script>
</body>
</html>
